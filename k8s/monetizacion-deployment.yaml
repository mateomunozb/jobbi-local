# Contexto Monetización.
#
# Vive en su propio manifiesto porque, además de los endpoints de consulta, es
# el consumidor del evento CONTRATACION_COMPLETADA (SNS -> SQS en LocalStack).
# Conserva el nombre de Service `servicio-monetizacion` y el puerto 8000 para
# que los port-forwards y la prueba de carga k6 existentes sigan siendo válidos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-monetizacion
  namespace: aws-local
  labels: { app: servicio-monetizacion, contexto: monetizacion }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicio-monetizacion
  template:
    metadata:
      labels: { app: servicio-monetizacion, contexto: monetizacion }
      # Prometheus descubre el Pod por estas anotaciones (k8s/monitoring).
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      containers:
      - name: monetizacion
        image: jobbi/backend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - { name: SERVICE_MODULE, value: "monetizacion" }
        - { name: PORT, value: "8000" }
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: postgres-urls, key: monetizacion }
        - name: AWS_ENDPOINT_URL
          value: "http://localstack.aws-local.svc.cluster.local:4566"
        - { name: AWS_REGION, value: "us-east-1" }
        - { name: QUEUE_NAME, value: "monetizacion-events-queue" }
        - { name: QUEUE_DLQ_NAME, value: "monetizacion-events-dlq" }
        - { name: SQS_ENABLED, value: "true" }
        # Hilos consumidores (long polling, lotes de 10 mensajes cada uno).
        - { name: SQS_HILOS, value: "2" }
        # Productor de BILLETERA_BLOQUEADA (outbox → SNS → Comunicación).
        - { name: SNS_ENABLED, value: "true" }
        - { name: SNS_TOPIC_BILLETERA_BLOQUEADA, value: "billetera-bloqueada-topic" }
        # Este servicio (y solo este) publica las conexiones totales de PostgreSQL.
        - { name: METRICAS_POSTGRES, value: "true" }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-monetizacion
  namespace: aws-local
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: servicio-monetizacion

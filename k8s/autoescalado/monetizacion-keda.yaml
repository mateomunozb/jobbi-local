# Auto-escalado horizontal de Monetización según la cola SQS (KEDA).
#
#   ./scripts/deploy-autoescalado.sh            instala KEDA y aplica este archivo
#   ./scripts/deploy-autoescalado.sh --quitar   lo retira y deja 1 réplica fija
#
# Qué escala y por qué con la cola: el trabajo de Monetización llega por la cola
# `monetizacion-events-queue`, no por HTTP. Su CPU casi no sube aunque la cola
# crezca (el worker pasa el tiempo esperando a SQS y a PostgreSQL), así que un
# HPA por CPU reaccionaría tarde o nunca. Lo que dice "hay trabajo atrasado" es
# la profundidad de la cola: es la señal que se usa en AWS (ECS/EKS escalando
# por ApproximateNumberOfMessages) y la que lee KEDA aquí, contra LocalStack.
#
# Regla: réplicas = ⌈mensajes visibles ÷ queueLength⌉, entre 1 y 3. Con
# queueLength=100: hasta 100 mensajes esperando → 1 Pod; 101-200 → 2; más → 3.
# Se sube como mucho 1 Pod cada 30 s (se ve 1 → 2 → 3, sin saltar) y se baja
# 1 Pod por minuto después de 3 min sin necesitarlo (evita el vaivén: con 2 min,
# una cola que se drena rápido bajaba a 1 réplica justo antes de la siguiente ola).
#
# Varias réplicas son seguras: el Idempotent Receiver descarta el mismo evento
# si lo toman dos Pods, el saldo se suma en SQL y el outbox reparte con
# FOR UPDATE SKIP LOCKED (ver monetizacion/repositorio.py y common/outbox.py).
apiVersion: v1
kind: Secret
metadata:
  name: credenciales-localstack
  namespace: aws-local
type: Opaque
stringData:
  # LocalStack acepta cualquier credencial; en AWS real iría un rol IAM (IRSA).
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: credenciales-localstack
  namespace: aws-local
spec:
  secretTargetRef:
  - { parameter: awsAccessKeyID, name: credenciales-localstack, key: AWS_ACCESS_KEY_ID }
  - { parameter: awsSecretAccessKey, name: credenciales-localstack, key: AWS_SECRET_ACCESS_KEY }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: monetizacion-cola
  namespace: aws-local
spec:
  scaleTargetRef:
    name: servicio-monetizacion
  minReplicaCount: 1
  maxReplicaCount: 3
  # Con mínimo 1, quien pregunta es el HPA de Kubernetes, cada 15 s (su ciclo
  # de sincronización); KEDA responde leyendo la cola en ese momento.
  advanced:
    horizontalPodAutoscalerConfig:
      name: monetizacion-cola
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - { type: Pods, value: 1, periodSeconds: 30 }     # +1 Pod cada 30 s como máximo
        scaleDown:
          stabilizationWindowSeconds: 180                   # 3 min sin necesitarlo antes de bajar
          policies:
          - { type: Pods, value: 1, periodSeconds: 60 }     # -1 Pod por minuto
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: credenciales-localstack
    metadata:
      queueURL: http://localstack.aws-local.svc.cluster.local:4566/000000000000/monetizacion-events-queue
      awsEndpoint: http://localstack.aws-local.svc.cluster.local:4566
      awsRegion: us-east-1
      # Objetivo de mensajes esperando por Pod.
      queueLength: "100"
      # Solo los que esperan: los "en vuelo" ya los tiene un worker en la mano,
      # y contarlos haría que un Pod que va al día pareciera atrasado.
      scaleOnInFlight: "false"

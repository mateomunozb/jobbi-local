# Microservicios de dominio de JOBBI.
#
# Todos corren la misma imagen (jobbi/backend:v1) y se diferencian por la
# variable SERVICE_MODULE: un Pod y un Service por contexto delimitado, de modo
# que la frontera del dominio también es una frontera de red y de despliegue.
#
# Monetización vive en k8s/monetizacion-deployment.yaml porque además consume
# SQS y conserva el nombre de Service original (servicio-monetizacion).
#
# Cada Deployment recibe la URL de su propia base (`jobbi_<contexto>`) desde el
# Secret postgres-urls: ningún servicio conoce la cadena de conexión de otro.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identidad
  namespace: aws-local
  labels: { app: identidad, contexto: identidad-perfiles }
spec:
  replicas: 1
  selector:
    matchLabels: { app: identidad }
  template:
    metadata:
      labels: { app: identidad, contexto: identidad-perfiles }
    spec:
      containers:
      - name: identidad
        image: jobbi/backend:v1
        imagePullPolicy: Never
        ports: [{ containerPort: 8001 }]
        env:
        - { name: SERVICE_MODULE, value: "identidad" }
        - { name: PORT, value: "8001" }
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: postgres-urls, key: identidad }
        readinessProbe:
          httpGet: { path: /health, port: 8001 }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8001 }
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: { cpu: "50m", memory: "96Mi" }
          limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: identidad
  namespace: aws-local
spec:
  type: ClusterIP
  selector: { app: identidad }
  ports: [{ name: http, port: 8001, targetPort: 8001 }]

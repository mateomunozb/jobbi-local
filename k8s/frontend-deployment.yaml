apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobbi-frontend
  namespace: aws-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobbi-frontend
  template:
    metadata:
      labels:
        app: jobbi-frontend
    spec:
      containers:
      - name: frontend
        image: jobbi/frontend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        # El navegador llama a /api/... en el mismo origen; el servidor de Next
        # reenvía al gateway con esta URL (app/api/[...ruta]/route.ts la lee en
        # cada petición, así que cambiarla no obliga a reconstruir la imagen).
        - name: API_GATEWAY_URL
          value: "http://api-gateway.aws-local.svc.cluster.local:8080"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: jobbi-frontend
  namespace: aws-local
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: jobbi-frontend

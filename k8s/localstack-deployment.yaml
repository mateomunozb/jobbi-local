apiVersion: v1
kind: Namespace
metadata:
  name: aws-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: aws-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: "sqs,sns,secretsmanager"
        - name: EAGER_SERVICE_LOADING
          value: "1"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: aws-local
spec:
  type: ClusterIP
  ports:
  - port: 4566
    targetPort: 4566
    name: edge
  selector:
    app: localstack